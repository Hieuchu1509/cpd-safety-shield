<!--
  THESIS: Time you tear off and cannot get back. Twenty minutes as calendar sheets
  leaving the stack one by one. Refuses the automotive hero-video-plus-sensor-overlay
  arrangement this project itself shipped.
  OWN-WORLD: Lịch bloc, the Vietnamese tear-off day calendar. Flood colour as a field,
  never a tint: a burnt-ochre-to-vermilion heat ramp at constant luminance, newsprint
  sheet, binding holes, torn perforation, colossal tabular numeral, dense almanac
  micro-type. Gold only where the car acts.
  STORY: A parent understands that twenty minutes is shorter than they think, and that
  the car acts when every human link fails. They check their own car.
  FIRST VIEWPORT: One full-bleed ochre sheet, read in calendar order: dateline, then
  the colossal 00:00, then the statement naming the child, the scene photograph in the
  illustration block, the almanac opening on who is in the cabin. The primary action —
  the CPD self-check — lives on the final sheet, the one that does not tear.
  FORM: Lịch bloc, candidate 6 of the grounded list, seed key 3f8625cb.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

  <noscript>
    <div class="khong-script">
      <h2>Toàn bộ tám phân đoạn</h2>
      <ol>
        <li>
          <h3>1. Bãi Đỗ Xe Nắng Gắt &amp; Vội Vã</h3>
          <p>Ánh nắng ban trưa đổ dồn xuống bãi đỗ xe ngoài trời như thiêu như đốt. Vừa tắt máy, hệ thống Phát hiện Trẻ em (CPD) lập tức kích hoạt ngầm. Người bố vì áp lực cuộc họp khẩn nên hoàn toàn không để ý cảnh báo nhấp nháy trên taplo.</p>
          <p lang="en">The midday sun scorches down relentlessly upon the open concrete lot. As the engine cuts out, the Child Presence Detection (CPD) silently arms itself. Rushing to an urgent meeting, the father overlooks the blinking dash warning.</p>
        </li>
        <li>
          <h3>2. Camera Cabin &amp; Quét Radar Ghế Sau</h3>
          <p>Trong xe, camera nhận diện đứa bé vẫn đang ngủ quên ở hàng ghế sau. Tín hiệu cảnh báo ban đầu phát ra chuỗi âm thanh ting... ting... ting... dồn dập suốt 30 giây rồi tắt. Sau 2 phút im lặng, cơ chế cảnh báo leo thang 20 phút chính thức vận hành.</p>
          <p lang="en">Inside, the in-cabin camera scans the sleeping toddler in the child seat. Initial acoustic chimes pulse for 30 seconds. After 2 minutes of silence, the 20-minute multi-stage escalation protocol initiates.</p>
        </li>
        <li>
          <h3>3. Chiếc Điện Thoại Im Lìm Trong Phòng Họp</h3>
          <p>Thế nhưng, chiếc điện thoại đã bị tắt tiếng hoàn toàn, nằm im lìm trên bàn phòng họp kín. Không ai hay biết điều nguy hiểm gì đang chuẩn bị xảy ra bên dưới bãi xe.</p>
          <p lang="en">However, the smartphone sits completely muted on the closed boardroom conference table. Absorbed in the intense presentation, no one notices the silent red emergency alerts.</p>
        </li>
        <li>
          <h3>4. Nhiệt Độ Đạt 38°C - Cơ Chế Tự Vệ Kích Hoạt</h3>
          <p>Đến đợt cảnh báo thứ 5, nhiệt độ trong khoang xe đóng kín đã chạm ngưỡng 38°C. Cảm biến nhiệt lập tức kích hoạt lớp bảo vệ khẩn cấp: kính xe rít nhẹ hạ xuống 2 cm ở một bên để thoát khí nóng, quạt điều hòa gầm lên tối đa!</p>
          <p lang="en">By the 5th warning cycle, the cabin temp hits 38°C. Thermal sensors trigger the emergency mitigation: the side window lowers 2cm to vent searing air, and the AC blower roars to max capacity.</p>
        </li>
        <li>
          <h3>5. Người Bảo Vệ Phát Hiện Qua Khe Kính 2cm</h3>
          <p>Tiếng còi inh ỏi xé toạc không gian bãi xe khiến người bảo vệ chú ý. Chạy lại gần, nhìn qua khe kính hở 2cm, ông hoảng hốt thấy đứa bé đang giãy giụa khóc ngặt nghẽo bên trong.</p>
          <p lang="en">The piercing horn cuts across the lot, alerting the security guard. Rushing over and peering through the 2cm opening, he recoils in shock seeing the toddler crying inside.</p>
        </li>
        <li>
          <h3>6. Cánh Cửa Phòng Họp Bật Mở &amp; Cơn Hoảng Loạn</h3>
          <p>“Xe ai biển số 51H-... mau xuống bãi đỗ xe! Có đứa bé bị kẹt trong xe đang gào khóc kìa!” Cả phòng họp sững sờ. Mặt người bố cắt không còn giọt máu, anh bật dậy hất tung chiếc ghế, vứt vội tài liệu rồi lao như bay xuống cầu thang.</p>
          <p lang="en">'Whose car is 51H-...? Hurry down to the lot! There's a child trapped crying inside!' The room freezes. Blood drains from the father's face; he knocks over his chair and bolts down the stairwell.</p>
        </li>
        <li>
          <h3>7. Cứu Con Trong Nước Mắt &amp; Lời Xin Lỗi</h3>
          <p>Giữa bãi xe nắng rát, tiếng còi báo động xen lẫn tiếng khóc nghẹn ngào của con trẻ như bóp nghẹt tim anh. Giật tung cánh cửa, anh bế thốc con vào lòng, toàn thân run rẩy khi mồ hôi và nước mắt đứa bé ướt đẫm vai áo mình.</p>
          <p lang="en">In the blazing heat, the siren intertwined with his child's weeping tears at his soul. Yanking open the door, he pulls his child into a trembling embrace, tears and sweat soaking his shoulder.</p>
        </li>
        <li>
          <h3>8. Tổng Kết Công Nghệ CPD Bảo Vệ Sinh Mạng</h3>
          <p>Hệ thống Phát hiện Trẻ em (CPD) kết hợp mmWave Radar 60GHz, camera quang học, cơ chế hạ kính thoát nhiệt và còi báo động ngoại vi — lá chắn công nghệ âm thầm bảo vệ những sinh mệnh quý giá nhất.</p>
          <p lang="en">The Child Presence Detection (CPD) system blends 60GHz mmWave radar, optical AI vision, thermal glass venting, and community audible alarms — a silent high-tech shield protecting our most precious lives.</p>
        </li>
      </ol>
      <p class="cot-in">Phim ngắn dàn dựng. Hình ảnh minh họa do AI tạo.</p>
    </div>
